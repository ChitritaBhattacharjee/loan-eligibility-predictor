<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
            color: #fff;
            background-color: #007BFF;
            border: none;
            border-radius: 5px;
            text-decoration: none;
        }
        .button:hover {
            background-color: #0056b3;
        }
    </style>
    <title>Register</title>
</head>
<body>
    <h1>Register Page</h1>

    <div style="text-align: center;">
        <form method="POST" action="">
            {{ form.hidden_tag() }}
            <label for="username">Username:</label><br>
            {{ form.username() }}<br><br>
            <label for="password">Password:</label><br>
            {{ form.password() }}<br><br>
            {{ form.submit() }}
        </form>
    </div>
    <br><br>
    <div style="text-align: center;">
        <a class="button" href="{{ url_for('login') }}">Already have an account? Login</a>
    </div>
</body>
</html>
